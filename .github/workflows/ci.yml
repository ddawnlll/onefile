name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  self-test:
    name: Safety & Causality Self-Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked project dependencies in isolated environment
        run: uv sync --frozen --python 3.12

      - name: Run execution, causality and offline audit regressions in one process
        run: uv run --no-sync --python 3.12 python -m unittest discover -s tests -v --durations 10

      - name: Set up Node for Pi extension tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pi extension policy and hook unit tests
        run: node --experimental-strip-types --test .pi/tests/onefile-extensions.test.mjs
