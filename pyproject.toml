[project]
name = "onefile"
version = "0.1.0"
description = "ONEFILE Brick 1: exploratory BTC 4h event study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "vectorbt>=1.0.0",
    "scikit-learn>=1.6.0",
    "xgboost-cpu>=3.0,<4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "xgboost>=3.0,<4; sys_platform != 'linux' or platform_machine != 'x86_64'",
]
